<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>LuxStay PMS - Login</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

                extend: {

                        "surface-variant": "#d8e3fa",
                        "on-secondary-fixed-variant": "#005231",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xs": "4px",
                        "base": "8px",
                        "grid-margin": "24px",
                        "sm": "12px",
                        "md": "24px",
                        "lg": "40px",
                        "xl": "64px",
                        "grid-gutter": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],

<body class="min-h-screen bg-background relative flex items-center justify-center p-grid-margin antialiased">
<!-- Subtle Background Element -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="w-full h-full bg-cover bg-center opacity-40" data-alt="A highly detailed, professional photograph of a modern luxury hotel lobby in light mode. The scene features clean architectural lines, expansive windows letting in soft natural daylight, and elegant minimalist furniture. The color palette consists of crisp whites, soft greys, and subtle hints of deep navy blue. The atmosphere is calm, orderly, and perfectly suited for a high-end property management system background." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB1xrX8HyPPi9SbjI8aESHB6xiXIsfvE-goUjCH8v-ZX72tszs3Fjn4cfl7obgBu3JVALDKyNHr3OskHW3usoIRTmkBigc8-zx3A_JM-dTmCKESXp12x0asBHmvoGSdxvE1IvvDnSkhd_o_mdS6FO3GUmu6qSsIUbkx0OtEGqrTuolZZZpG8msSveLYNxLvaGwd8uVkkOaf4_8mqggxxFvjcqoaOWWSU5NRAqk_jxShe_W64ZzGTqrUUA')"></div>
<div class="absolute inset-0 bg-background/70 backdrop-blur-[2px]"></div>
</div>
<!-- Login Card (Level 2 Elevation equivalent) -->
<main class="relative z-10 w-full max-w-[440px] bg-surface rounded-xl shadow-2xl p-lg flex flex-col gap-lg border border-surface-container-highest">
<!-- Header -->
<header class="text-center flex flex-col gap-xs">
<h1 class="font-display-lg text-display-lg font-bold text-primary tracking-tight">LuxStay PMS</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Gestión Operativa</p>
</header>
<!-- Branch Selector (Segmented Control) -->
<section class="flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">Seleccionar Sucursal</label>
<div class="flex p-[2px] bg-surface-container-low border border-outline-variant/30 rounded-lg">
<button class="flex-1 py-xs px-sm rounded-md font-label-caps text-label-caps bg-primary text-on-primary shadow-sm transition-all text-center">
                    Centro Histórico
                </button>
<button class="flex-1 py-xs px-sm rounded-md font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-highest transition-all text-center">
                    Magisterio
                </button>
<button class="flex-1 py-xs px-sm rounded-md font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-highest transition-all text-center">
                    Pisac
                </button>
</div>
</section>
<!-- Login Form -->
<form class="flex flex-col gap-md">
<!-- Username Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="username">Usuario</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md pl-lg pr-sm py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant/60" id="username" placeholder="Ingrese su usuario" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-end">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Contraseña</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container hover:underline transition-colors" href="#">¿Olvidé contraseña?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-md pl-lg pr-sm py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant/60" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-semibold py-[10px] rounded-lg hover:bg-primary-container hover:shadow-md transition-all mt-sm flex items-center justify-center gap-xs" type="button">
<span>Acceder al Sistema</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
</main>
</body></html>
