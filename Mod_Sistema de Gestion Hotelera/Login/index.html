<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxStay PMS - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
// Paleta Brand_core (la misma en los 3 módulos)
tailwind.config = { theme: { extend: {
  colors: { primary:"#002045", "primary-container":"#1a365d", secondary:"#0a6c44",
    "secondary-container":"#9ff5c1", tertiary:"#3e1200", error:"#ba1a1a",
    "error-container":"#ffdad6", surface:"#f9f9ff", background:"#f9f9ff",
    "surface-container":"#e7eeff", "surface-container-low":"#f0f3ff",
    "surface-container-high":"#dee8ff", "surface-container-highest":"#d8e3fa",
    "surface-container-lowest":"#ffffff", outline:"#74777f", "outline-variant":"#c4c6cf",
    "on-surface":"#111c2c", "on-surface-variant":"#43474e", "on-primary":"#ffffff" },
  fontFamily: { display:["Hanken Grotesk"], body:["Inter"] }
}}};
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-background flex items-center justify-center p-6 font-body">
<div class="bg-foto"></div>

<main class="card-login">
  <div class="text-center">
    <span class="material-symbols-outlined logo-ico">domain</span>
    <h1 class="font-display titulo">LuxStay PMS</h1>
    <p class="subtitulo">Gestión Operativa</p>
  </div>

  <label class="etiqueta">Seleccionar Sucursal</label>
  <div id="sucursales" class="grid grid-cols-3 gap-2">
    <button data-suc="Centro Histórico" class="btn-suc activo">Centro Histórico</button>
    <button data-suc="Magisterio" class="btn-suc">Magisterio</button>
    <button data-suc="Pisac" class="btn-suc">Pisac</button>
  </div>

  <div class="campo">
    <label for="usuario">Usuario</label>
    <div class="input-ico">
      <span class="material-symbols-outlined">person</span>
      <input id="usuario" type="text" placeholder="Ingrese su usuario" autocomplete="username">
    </div>
    <small class="msg" id="msgUsuario"></small>
  </div>

  <div class="campo">
    <label for="clave">Contraseña</label>
    <div class="input-ico">
      <span class="material-symbols-outlined">lock</span>
      <input id="clave" type="password" placeholder="••••••••" autocomplete="current-password">
      <button id="verClave" type="button" title="Ver clave"><span class="material-symbols-outlined">visibility</span></button>
    </div>
    <small class="msg" id="msgClave"></small>
  </div>

  <button id="btnEntrar" class="btn-entrar">Acceder al Sistema <span class="material-symbols-outlined">arrow_forward</span></button>
  <p class="nota">Sin backend: entra con cualquier usuario y clave (mín. 4 letras).</p>
</main>
<script src="script.js"></script>
</body>
</html>
